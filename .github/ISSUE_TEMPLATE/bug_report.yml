name: Bug report
description: 报告可复现的功能问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿在公开 Issue 中粘贴令牌、私密项目内容或可直接利用的漏洞细节。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 0.9.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 24H2 / Godot 4.7.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最短、稳定的复现流程。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
    validations:
      required: true
  - type: checkboxes
    id: audit
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认问题不含需要私下报告的安全漏洞。
          required: true
