name: Feature request
description: 提议新的业务能力或工作流改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 网络与隐私
      options:
        - label: 我已说明该功能是否涉及联网、遥测、账号或远程资源。
          required: true
